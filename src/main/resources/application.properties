spring.application.name=PiedPiper

spring.datasource.url=jdbc:postgresql://localhost:5432/freelance
spring.datasource.username=${DATABASE_LOGIN:user}
spring.datasource.password=${DATABASE_PASSWORD:password}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

server.port=8080

cors.allowed-origins=*


spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.log-validators=true
spring.flyway.out-of-order=true

jwt.secret=${JWT_SECRET:VGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS1mb3ItcGllZC1waXBlci1tdnAtcHJvamVjdA==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# MinIO Configuration
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET_NAME:freelancematch}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
