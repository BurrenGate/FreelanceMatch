spring.application.name=PiedPiper

# Database
# Update the values below to match your local PostgreSQL setup
spring.datasource.url=jdbc:postgresql://localhost:5432/pied_pipper_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# Server
server.port=8080

# CORS (allow the frontend index.html to call the API)
# If you serve index.html from a different port, adjust below.
cors.allowed-origins=*

# Logging
logging.level.com.freelancerplatform=DEBUG

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true